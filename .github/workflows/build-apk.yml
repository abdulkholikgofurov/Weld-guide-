name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract ZIP and fix JS strings
        run: |
          for z in *.zip; do
            if [ -f "$z" ]; then
              unzip -oq "$z" -x ".github/*"
            fi
          done

          if [ ! -d "src" ]; then
            SUBDIR=$(find . -maxdepth 2 -type d -name "src" | head -n 1 | xargs dirname)
            if [ -n "$SUBDIR" ] && [ "$SUBDIR" != "." ]; then
              cp -rf "$SUBDIR"/* .
            fi
          fi

          python3 - << 'PY'
          import glob, re
          for path in glob.glob("src/**/*.js", recursive=True):
              with open(path, "r", encoding="utf-8") as f:
                  txt = f.read()
              fixed = re.sub(r'"((?:[^"\\]|\\.)*)"', lambda m: '"' + m.group(1).replace('\n', '\\n') + '"', txt, flags=re.S)
              with open(path, "w", encoding="utf-8") as f:
                  f.write(fixed)
          PY

          cat << 'EOF' > index.html
          <!doctype html>
          <html lang="uz">
            <head>
              <meta charset="UTF-8" />
              <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
              <title>ISO 2553 & 6947 Welding Guide</title>
            </head>
            <body class="bg-slate-900 text-slate-100 select-none">
              <div id="root"></div>
              <script type="module" src="/src/main.jsx"></script>
            </body>
          </html>
          EOF

          cat << 'EOF' > vite.config.js
          import { defineConfig } from 'vite';
          import react from '@vitejs/plugin-react';
          export default defineConfig({ plugins: [react()], base: './' });
          EOF

          cat << 'EOF' > tailwind.config.js
          export default { content: ["./index.html", "./src/**/*.{js,jsx}"], theme: { extend: {} }, plugins: [] };
          EOF

          cat << 'EOF' > postcss.config.js
          export default { plugins: { tailwindcss: {}, autoprefixer: {} } };
          EOF

          cat << 'EOF' > capacitor.config.json
          {
            "appId": "uz.welding.isostandards",
            "appName": "ISO 2553 & 6947 Сварка",
            "webDir": "dist",
            "bundledWebRuntime": false
          }
          EOF

          cat << 'EOF' > package.json
          {
            "name": "iso-welding-guide",
            "version": "1.0.0",
            "private": true,
            "type": "module",
            "scripts": {
              "build": "vite build"
            },
            "dependencies": {
              "@capacitor/android": "^6.1.2",
              "@capacitor/core": "^6.1.2",
              "pdfjs-dist": "^4.4.168",
              "react": "^18.3.1",
              "react-dom": "^18.3.1"
            },
            "devDependencies": {
              "@capacitor/cli": "^6.1.2",
              "@vitejs/plugin-react": "^4.3.1",
              "autoprefixer": "^10.4.20",
              "postcss": "^8.4.41",
              "tailwindcss": "^3.4.10",
              "vite": "^5.4.2"
            }
          }
          EOF

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install dependencies & Build Web App
        run: |
          npm install --legacy-peer-deps
          mkdir -p public/pdfjs
          cp node_modules/pdfjs-dist/build/pdf.worker.min.mjs public/pdfjs/pdf.worker.min.mjs
          npm run build

      - name: Configure Android & Launcher Icon
        run: |
          npx cap add android
          if [ -f "public/icon.png" ]; then
            for dir in mipmap-mdpi mipmap-hdpi mipmap-xhdpi mipmap-xxhdpi mipmap-xxxhdpi; do
              mkdir -p "android/app/src/main/res/$dir"
              cp public/icon.png "android/app/src/main/res/$dir/ic_launcher.png"
              cp public/icon.png "android/app/src/main/res/$dir/ic_launcher_round.png"
            done
          fi
          npx cap sync android

      - name: Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ISO-2553-6947-Welding-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          
