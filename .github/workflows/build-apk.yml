name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Auto-extract uploaded ZIP archive
        run: |
          for z in *.zip; do
            if [ -f "$z" ]; then
              unzip -o "$z"
            fi
          done

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install dependencies & Copy PDF worker
        run: |
          npm install
          mkdir -p public/pdfjs
          cp node_modules/pdfjs-dist/build/pdf.worker.min.mjs public/pdfjs/pdf.worker.min.mjs

      - name: Build Web App
        run: npm run build

      - name: Add Android & Generate Launcher Icons
        run: |
          npx cap add android
          npx capacitor-assets generate --android --iconBackgroundColor '#0f172a' || true
          npx cap sync android

      - name: Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ISO-2553-6947-Welding-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          
